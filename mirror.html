<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalu · Phone screen</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0e; --bar: #17171c; --line: #2a2a32; --fg: #f2f2f5; --dim: #9a9aa6; --acc: #6aa8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; overflow: hidden; user-select: none; }
  #stage { position: absolute; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #screen { max-width: 100%; max-height: 100%; display: none; touch-action: none; outline: none; background: #000; }
  #screen.on { display: block; }
  #screen.ctl { cursor: pointer; }
  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: var(--dim); }
  #msg b { color: var(--fg); font-size: 15px; font-weight: 600; }
  #msg.hide { display: none; }
  #msg .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); animation: pulse 1.2s ease-in-out infinite; }
  #msg.static .dot { animation: none; background: #666; }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--bar); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  button { flex: none; white-space: nowrap; font: inherit; color: var(--fg); background: #24242b; border: 1px solid var(--line); border-radius: 9px; height: 36px; min-width: 40px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  button:hover { background: #2e2e37; }
  button:active { background: #383843; }
  button:disabled { opacity: .35; cursor: default; }
  button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #typed { flex: 1 1 0; min-width: 40px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: #101015; color: var(--fg); padding: 0 10px; font: inherit; user-select: text; }
  #typed:disabled { opacity: .35; }
  #stop { background: #3a1f24; border-color: #5a2a32; }
  #stop:hover { background: #4a252c; }
  #badge { position: absolute; top: 8px; left: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(20,20,26,.78); border: 1px solid var(--line); font-size: 11px; color: var(--dim); display: none; pointer-events: none; }
  #badge.on { display: block; }
  #badge i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e5484d; margin-right: 6px; vertical-align: 0; }
  #notice { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); background: rgba(30,30,38,.94); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-size: 12px; display: none; max-width: 90%; text-align: center; }
  #notice.on { display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" tabindex="0"></canvas>
  <div id="badge"><i></i><span id="badgeText"></span></div>
  <div id="msg"><div class="dot"></div><b id="msgTitle"></b><span id="msgSub"></span></div>
  <div id="notice"></div>
</div>
<div id="bar">
  <button id="bBack" data-k="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="bHome" data-k="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg></button>
  <button id="bRecents" data-k="recents"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg></button>
  <button id="bNotif" data-k="notifications"><svg viewBox="0 0 24 24"><path d="M6 17h12l-1.6-2.4V10a4.4 4.4 0 00-8.8 0v4.6zM10 20h4"/></svg></button>
  <input id="typed" type="text" autocomplete="off" spellcheck="false">
  <button id="bSend"></button>
  <button id="stop"></button>
</div>
<script src="mirror.js"></script>
</body>
</html>
