<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalu — Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="panel" id="panel">
  <div class="orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

  <aside class="side">
    <div class="dragbg pywebview-drag-region"></div>
    <div class="brand"><span class="logo"></span><span id="brandName">Dalu</span></div>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="text" autocomplete="off" spellcheck="false">
    </label>
    <nav class="nav" id="nav"><i class="nav-hl" id="navHl"></i></nav>
    <div class="grow"></div>
    <div class="ver" id="verLine"></div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="dragbg pywebview-drag-region"></div>
      <h1 id="pageTitle"></h1>
      <div class="winbtns">
        <button class="min" id="btnMin" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button class="close" id="btnClose" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </header>
    <div class="scroll" id="scroll"><div class="page" id="page"></div></div>
    <div class="toast" id="toast"></div>
  </section>
</div>

<script src="icons.js"></script>
<script src="glass.js"></script>
<script src="prefs_shared.js"></script>
<script src="i18n_cjk.js"></script>
<script src="settings_schema.js"></script>
<script src="settings.js"></script>
</body>
</html>
